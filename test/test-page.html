<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Draw A Kanji As It Should Be — test page</title>
  <style>
    :root {
      --bg: #14151a;
      --panel: #1c1e25;
      --panel-border: #2c2f3a;
      --text: #eaeaf0;
      --text-dim: #9497a6;
      --accent: #f0708a;
      --accent-2: #f0a860;
      --canvas: #ffffff;
      --canvas-border: #3a3d4a;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem clamp(1rem, 4vw, 3rem) 4rem;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      margin: 0 0 0.15rem;
      letter-spacing: -0.01em;
    }

    header .subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    h2 .badge {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--accent);
      background: rgba(240, 112, 138, 0.12);
      border: 1px solid rgba(240, 112, 138, 0.35);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }

    section.panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.75rem;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1rem 1.25rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .field label {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: 500;
    }

    .field.checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.5rem;
      padding-top: 1.2rem;
    }

    .field.checkbox label {
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }

    input[type="text"],
    input[type="number"],
    select {
      background: #14151a;
      border: 1px solid var(--panel-border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.4rem 0.55rem;
      font-size: 0.9rem;
      width: 100%;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--panel-border);
      margin: 1.25rem 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    .toolbar .actions {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--panel-border);
      background: #23252e;
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }

    button:hover {
      background: #2b2e39;
      border-color: #3d4152;
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #1b0b10;
    }

    button.primary:hover {
      background: #f4879e;
    }

    .stage {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .kanji-box {
      background: var(--canvas);
      border-radius: 8px;
      overflow: hidden;
      flex: 0 0 auto;
      /* Fallback box size for when `size` is left unset — demonstrates that
         createKanjiAnimation without `size` just fills whatever space this
         container's own CSS gives it (point 5 of the border/size feature). */
      width: 220px;
      height: 220px;
      /* No CSS border here on purpose — the library's own `border` config
         option draws it inside the SVG itself (see grid.js's buildBorder),
         so it's visible even if the SVG is extracted from this wrapper. */
    }

    .kanji-box svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    #text-container {
      background: var(--canvas);
      border: 1px solid var(--canvas-border);
      border-radius: 8px;
      padding: 0.75rem;
      min-height: 60px;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin-bottom: 0.75rem;
    }

    #text-container .dakaisb-char {
      box-sizing: border-box;
      /* No CSS border here either — same reasoning as .kanji-box above. */
    }

    .log {
      white-space: pre-wrap;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--text-dim);
      background: #14151a;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      min-height: 1.6rem;
    }

    .log:empty::before {
      content: "—";
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>Draw A Kanji As It Should Be</h1>
    <div class="subtitle">Test page — dependency-free stroke-order animation for KanjiVG SVGs</div>
  </header>

  <section class="panel">
    <h2>Shared config <span class="badge">applies to both demos below</span></h2>

    <div class="field-grid">
      <div class="field">
        <label for="speed-input">Speed (ms/stroke)</label>
        <input id="speed-input" type="number" value="350" min="50" step="50">
      </div>
      <div class="field">
        <label for="size-input">Size (px, empty = auto)</label>
        <input id="size-input" type="number" placeholder="e.g. 220" min="40" step="10">
      </div>
      <div class="field">
        <label for="criteria-select">Color criteria</label>
        <select id="criteria-select">
          <option value="MAIN">MAIN</option>
          <option value="SUB1">SUB1</option>
        </select>
      </div>
      <div class="field">
        <label for="text-interval-input">Interval between kanji (ms, text only)</label>
        <input id="text-interval-input" type="number" value="500" min="0" step="100">
      </div>

      <div class="field checkbox">
        <input id="numbers-input" type="checkbox">
        <label for="numbers-input">Stroke numbers</label>
      </div>
      <div class="field">
        <label for="number-color-input">Number color</label>
        <input id="number-color-input" type="text" placeholder="e.g. #f0708a">
      </div>
      <div class="field checkbox">
        <input id="grid-input" type="checkbox">
        <label for="grid-input">Show grid</label>
      </div>
      <div class="field">
        <label for="grid-color-input">Grid color</label>
        <input id="grid-color-input" type="text" value="#aaaaaa">
      </div>
      <div class="field">
        <label for="grid-style-select">Grid style</label>
        <select id="grid-style-select">
          <option value="dashed" selected>dashed</option>
          <option value="solid">solid</option>
          <option value="dotted">dotted</option>
        </select>
      </div>
      <div class="field">
        <label for="grid-width-input">Grid width</label>
        <input id="grid-width-input" type="number" value="1" min="1" step="1">
      </div>

      <div class="field checkbox">
        <input id="model-input" type="checkbox">
        <label for="model-input">Show model</label>
      </div>
      <div class="field">
        <label for="model-color-input">Model color</label>
        <input id="model-color-input" type="text" value="#dddddd">
      </div>
      <div class="field">
        <label for="anim-color-input">Animation color</label>
        <input id="anim-color-input" type="text" placeholder="e.g. red (empty = off)">
      </div>
      <div class="field">
        <label for="anim-fade-input">Fade %</label>
        <input id="anim-fade-input" type="number" value="0" min="0" max="100" step="10">
      </div>

      <div class="field checkbox">
        <input id="border-input" type="checkbox">
        <label for="border-input">Show border</label>
      </div>
      <div class="field">
        <label for="border-color-input">Border color</label>
        <input id="border-color-input" type="text" value="#aaaaaa">
      </div>
      <div class="field">
        <label for="border-style-select">Border style</label>
        <select id="border-style-select">
          <option value="solid">solid</option>
          <option value="dashed">dashed</option>
          <option value="dotted">dotted</option>
        </select>
      </div>
      <div class="field">
        <label for="border-width-input">Border width</label>
        <input id="border-width-input" type="number" value="1" min="1" step="1">
      </div>
      <div class="field">
        <label for="dimension-select">Grid/border width unit</label>
        <select id="dimension-select">
          <option value="pixel" selected>pixel (constant on screen)</option>
          <option value="unit">unit (scales with size)</option>
        </select>
      </div>
      <div class="field">
        <label for="gap-input">Gap between kanji (px, text only)</label>
        <input id="gap-input" type="number" value="0" min="0" step="1">
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>createKanjiAnimation <span class="badge">single kanji</span></h2>

    <div class="toolbar">
      <div class="field">
        <label for="kanji-select">Kanji</label>
        <select id="kanji-select">
          <option value="063a2.svg">探 (063a2)</option>
          <option value="05c0e.svg">導 (05c0e)</option>
        </select>
      </div>
      <div class="actions">
        <button id="btn-load">Load</button>
        <button id="btn-play" class="primary">Play</button>
        <button id="btn-pause">Pause</button>
        <button id="btn-stop">Stop</button>
      </div>
    </div>

    <div class="stage">
      <div id="container-1" class="kanji-box"></div>
    </div>
    <div id="log" class="log"></div>
  </section>

  <section class="panel">
    <h2>createKanjiAnimationFromText <span class="badge">multi-kanji text</span></h2>

    <div class="toolbar">
      <div class="field">
        <label for="text-input">Text</label>
        <input id="text-input" type="text" value="早速">
      </div>
      <div class="field">
        <label for="svgpath-input">svgPath</label>
        <input id="svgpath-input" type="text" value="../assets/kanjivg/">
      </div>
      <div class="actions">
        <button id="btn-text-load">Load text</button>
        <button id="btn-text-play" class="primary">Play</button>
        <button id="btn-text-pause">Pause</button>
        <button id="btn-text-stop">Stop</button>
      </div>
    </div>

    <div id="text-container"></div>
    <div id="text-log" class="log"></div>
  </section>

  <script type="module">
    import { createKanjiAnimation, createKanjiAnimationFromText } from '../src/index.js';

    // Shared config panel — read by both the single-kanji and the
    // multi-kanji-text demo, so toggling e.g. "show grid" once affects both.
    function readSharedConfig() {
      const sizeRaw = document.getElementById('size-input').value;
      return {
        speed: Number(document.getElementById('speed-input').value) || 350,
        size: sizeRaw ? Number(sizeRaw) : undefined, // empty = let createKanjiAnimation fall back to its own default sizing
        colorCriteria: document.getElementById('criteria-select').value,
        showStrokeNumbers: document.getElementById('numbers-input').checked,
        strokeNumberColor: document.getElementById('number-color-input').value || undefined,
        strokeAnimationColor: document.getElementById('anim-color-input').value || null,
        strokeAnimationColorFade: Number(document.getElementById('anim-fade-input').value) || 0,
        showGrid: document.getElementById('grid-input').checked,
        gridColor: document.getElementById('grid-color-input').value || '#aaaaaa',
        gridStyle: document.getElementById('grid-style-select').value,
        gridWidth: Number(document.getElementById('grid-width-input').value) || 1,
        showModel: document.getElementById('model-input').checked,
        modelColor: document.getElementById('model-color-input').value || '#dddddd',
        border: document.getElementById('border-input').checked,
        borderColor: document.getElementById('border-color-input').value || '#aaaaaa',
        borderStyle: document.getElementById('border-style-select').value,
        borderWidth: Number(document.getElementById('border-width-input').value) || 1,
        borderGridDimension: document.getElementById('dimension-select').value,
      };
    }

    // --- single kanji demo ---
    const container = document.getElementById('container-1');
    const logEl = document.getElementById('log');
    let anim = null;

    function log(msg) {
      console.error(msg);
      logEl.textContent += msg + '\n';
    }

    async function load() {
      try {
        const file = document.getElementById('kanji-select').value;

        const res = await fetch(file);
        if (!res.ok) throw new Error(`fetch failed: ${res.status} ${res.statusText} for ${file}`);
        const svgText = await res.text();

        if (anim) anim.destroy();
        anim = createKanjiAnimation(svgText, container, readSharedConfig());
        log(`Loaded ${file} OK`);
      } catch (err) {
        log('ERROR: ' + err.message);
      }
    }

    document.getElementById('btn-load').addEventListener('click', load);
    document.getElementById('btn-play').addEventListener('click', () => anim && anim.play());
    document.getElementById('btn-pause').addEventListener('click', () => anim && anim.pause());
    document.getElementById('btn-stop').addEventListener('click', () => anim && anim.stop());

    // auto-load first kanji on page open
    load();

    // --- multi-kanji text demo ---
    const textLogEl = document.getElementById('text-log');
    let textAnim = null;

    function textLog(msg) {
      console.error(msg);
      textLogEl.textContent += msg + '\n';
    }

    async function loadText() {
      try {
        const text = document.getElementById('text-input').value;
        const svgPath = document.getElementById('svgpath-input').value;
        const interval = Number(document.getElementById('text-interval-input').value) || 0;
        const gap = Number(document.getElementById('gap-input').value) || 0;

        if (textAnim) textAnim.destroy();
        textAnim = await createKanjiAnimationFromText(text, document.getElementById('text-container'), {
          ...readSharedConfig(),
          svgPath,
          interval,
          gap,
        });
        textLog(`Loaded text "${text}" OK (${textAnim.instances.length} kanji rendered)`);
      } catch (err) {
        textLog('ERROR: ' + err.message);
      }
    }

    document.getElementById('btn-text-load').addEventListener('click', loadText);
    document.getElementById('btn-text-play').addEventListener('click', () => textAnim && textAnim.play());
    document.getElementById('btn-text-pause').addEventListener('click', () => textAnim && textAnim.pause());
    document.getElementById('btn-text-stop').addEventListener('click', () => textAnim && textAnim.stop());

    window.runTest = async (svgUrl, containerId) => {
      const res = await fetch(svgUrl);
      const svgText = await res.text();
      const c = document.getElementById(containerId);
      return createKanjiAnimation(svgText, c, { speed: 50 });
    };
  </script>
</body>
</html>
